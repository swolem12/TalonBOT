# Render.com Blueprint Configuration
# See: https://render.com/docs/blueprint-spec
#
# To deploy:
# 1. Fork this repository to your GitHub account
# 2. Go to Render Dashboard -> New -> Blueprint
# 3. Connect your forked repository
# 4. Configure environment variables
# 5. Deploy!

services:
  # TalonBOT - Signal Chatbot Background Worker
  - type: worker
    name: talonbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon # or frankfurt, singapore, ohio
    plan: starter # free, starter, standard, or pro
    autoDeploy: true
    # Persistent disk for SQLite database and signal-cli data
    disk:
      name: talonbot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Required Settings
      - key: SIGNAL_BOT_PHONE_NUMBER
        sync: false # Set this in Render dashboard
      - key: DATABASE_URL
        value: "file:/data/db/talonbot.db"
      
      # Admin Configuration
      - key: ADMIN_USERS
        sync: false
      - key: MASTER_ADMIN
        sync: false
      
      # Signal-CLI Configuration
      - key: SIGNAL_CLI_MODE
        value: daemon
      - key: SIGNAL_CLI_DATA_DIR
        value: /data/signal-cli
      
      # Bot Behavior
      - key: BOT_PREFIX
        value: "!"
      - key: STORE_MESSAGES
        value: "true"
      - key: MAX_MESSAGES_PER_MINUTE
        value: "10"
      
      # Environment
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

# Alternative: Use managed PostgreSQL instead of SQLite
# Uncomment below and remove the disk configuration above
# databases:
#   - name: talonbot-db
#     databaseName: talonbot
#     user: talonbot
#     plan: free # free, starter, standard, or pro
#
# Then update DATABASE_URL in envVars to use fromDatabase:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: talonbot-db
#       property: connectionString
